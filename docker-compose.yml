# Local stack: PostgreSQL (pgvector) vector DB + FastAPI. Mesh API handles embeddings and answer generation.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: primark_sop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d primark_sop || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: primark_sop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      HOME: /home/appuser
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  ingest:
    build: ./backend
    profiles:
      - ingest
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: primark_sop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SSLMODE: disable
      HOME: /home/appuser
    command:
      - python
      - -m
      - app.ingestion
      - --local-dir
      - /data/sops/Primark
    volumes:
      - ./sops/Primark:/data/sops/Primark:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
